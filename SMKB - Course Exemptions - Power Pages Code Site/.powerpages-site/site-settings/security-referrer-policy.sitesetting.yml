description: >-
  Limits how much of the current URL is sent as the Referer header on outbound
  requests. strict-origin-when-cross-origin sends the full path same-origin, only
  the origin cross-origin, and nothing when downgrading HTTPS to HTTP.
id: aaaaaaaa-0009-4000-8000-000000000009
name: HTTP/Referrer-Policy
value: strict-origin-when-cross-origin
