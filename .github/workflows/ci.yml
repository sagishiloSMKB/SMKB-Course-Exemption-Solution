name: CI

# Deterministic quality gates for every push / PR — no cloud auth required for the core jobs.
# The same checks run in each component's deploy script, so a deploy can never ship something CI
# would reject.
#
# This workflow is FOLDER-RENAME PROOF: it auto-discovers the Cloud Flows' flow-lint checker and the
# code-app (SPA) folders, so it keeps working after Init Project renames the starters. Jobs skip
# gracefully when their target isn't present (e.g. a starter that wasn't activated).
#
# NO SECRETS ARE REQUIRED. The private @smkbacil/design-ui package is vendored as a committed tarball
# and resolved with a `file:` spec, so every install here works with no credential. The token is used
# only on a developer machine, by scripts/vendor-design-ui.ps1, when the library is deliberately
# updated. template-guards enforces that invariant on every push.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The template must not trip its own guards, and .ps1 / solution XML must stay ASCII-only.
  # Zero-dependency, zero-auth — runs on every push regardless of activation state.
  template-guards:
    name: template-guards (self-consistency + ASCII)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-template-guards.mjs

  # The two gates CLAUDE.md presents as THE drift guard used to run only in .githooks/pre-commit,
  # which is an opt-in per clone (`git config core.hooksPath .githooks`). So on any clone that
  # skipped that one command - and on CI unconditionally - config drift and broken root-doc links
  # reached main unchecked. Zero-auth, zero-install: no reason not to run them here.
  root-gates:
    name: root gates (doc boundaries + config drift)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Doc boundaries
        run: node scripts/check-doc-boundaries.mjs
      # -Check exits 0 on the pristine template ("still the uninitialized starter-kit template")
      # and only compares ACTIVATED starters, so this is safe before and after Init Project.
      - name: Config drift
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File apply-config.ps1 -Check

  # flow-lint's own self-test, including the rule-coverage gate. It was referenced only in prose,
  # so a rule could ship with no test and stay green everywhere that mattered.
  flow-lint-selftest:
    name: flow-lint self-test (rule coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          t=$(find . -path '*/tools/flow-lint/test.mjs' -not -path '*/node_modules/*' | head -1)
          if [ -z "$t" ]; then
            echo "::error::flow-lint test.mjs not found - the Cloud Flows starter should always ship it."
            exit 1
          fi
          node "$t"

  flow-lint:
    name: flow-lint (cloud flows + solution XML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero-dependency Node ESM — no install needed. Auto-discover the checker wherever the (renamed)
      # Cloud Flows starter put it; skip if the Flows starter isn't activated.
      #
      # Gated on an INITIALIZED solution, exactly like .githooks/pre-commit: while the repo is still
      # the uninitialized template, the example flows carry starter placeholders ON PURPOSE and
      # flow-lint (correctly) errors on them. deploy.ps1 is the placeholder gate for a real solution.
      - name: Run flow-lint
        shell: bash
        run: |
          if [ ! -f solution.config.json ] || grep -q 'YourSolutionName' solution.config.json; then
            echo "Repo is still the uninitialized starter-kit template — skipping flow-lint."
            exit 0
          fi
          lint=$(find . -path '*/tools/flow-lint/lint.mjs' -not -path '*/node_modules/*' | head -1)
          if [ -z "$lint" ]; then
            echo "No flow-lint checker found (Cloud Flows starter not activated) — skipping."
            exit 0
          fi
          # Pass the Workflows folder explicitly (same as deploy.ps1 / the pre-commit hook) so the
          # run never depends on folder-name auto-discovery.
          flows="$(dirname "$(dirname "$(dirname "$lint")")")/Workflows"
          echo "Running $lint against $flows"
          node "$lint" "$flows"

  discover-spas:
    name: discover code-app folders
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        shell: bash
        # A code-app SPA folder = a top-level dir with a package.json AND an eslint config.
        # Excludes the onboarding app (removed at init) and anything without lint wiring.
        run: |
          apps=$(for d in */; do
            d="${d%/}"
            case "$d" in
              onboarding*|node_modules|.*) continue;;
              # A folder still named "SMKB - <X> Starter" is a NON-ACTIVATED starter: Init Project
              # renames every activated one, and Critical Rule 1 requires the rest to be left
              # untouched. Gating CI on a pristine template spends a job
              # on code that will never be deployed, and shows a red X for a starter the solution
              # is required not to touch.
              "SMKB - "*" Starter") echo "Skipping non-activated starter: $d" >&2; continue;;
            esac
            if [ -f "$d/package.json" ] && ls "$d"/eslint.config.* >/dev/null 2>&1; then
              printf '%s\n' "$d"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Discovered: $apps"

  spa-checks:
    name: ${{ matrix.app }} (lint + unit tests)
    needs: discover-spas
    if: needs.discover-spas.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover-spas.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No credential step, and no NPM_TOKEN anywhere: @smkbacil/design-ui resolves from the
      # committed tarball via its `file:` spec. template-guards fails the build if any consumer
      # reverts to a registry spec, so this job cannot silently regain a token dependency.
      #
      # Use each app's OWN package manager. Running npm in a pnpm project silently ignores the
      # committed pnpm-lock.yaml and resolves a different tree than the developer has.
      - name: Install
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            # corepack reads the "packageManager" field in package.json, so the pnpm major is
            # pinned by the repo rather than by whatever the runner image happens to bundle.
            # Without it a runner defaulting to pnpm 8 fails on lockfileVersion 9.0.
            corepack enable
            corepack prepare --activate
            pnpm --version
            pnpm install --frozen-lockfile
          else
            npm ci --no-audit --no-fund
          fi
      - name: Lint
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm run lint; else npm run lint; fi
      - name: Unit tests
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm test; else npm test --if-present; fi

  # OPTIONAL — Power Platform Solution Checker (Microsoft's static analysis, complements flow-lint).
  # Enable by setting the AZURE_* service-principal secrets and uncommenting. Export the solution
  # first (pac solution export) and point `path` at the zip. Use the Dev env URL from solution.config.json.
  #
  # solution-check:
  #   name: Solution Checker
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: microsoft/powerplatform-actions/actions-install@v1
  #     - uses: microsoft/powerplatform-actions/check-solution@v1
  #       with:
  #         environment-url: ${{ secrets.DATAVERSE_ENV_URL }}
  #         app-id: ${{ secrets.AZURE_CLIENT_ID }}
  #         client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
  #         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
  #         path: ./out/solution.zip   # export first with pac solution export
